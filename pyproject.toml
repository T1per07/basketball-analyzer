[project]
name = "basketball-analyzer"
version = "0.1.0"
description = "篮球投篮分析系统 - 检测、跟踪、轨迹分析、统计"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
    "supervision>=0.19.0",
    "ultralytics>=8.1.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "aiofiles>=23.0.0",
    "websockets>=12.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-v --tb=short"
